[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docustruct-ai"
version = "0.1.0"
description = "Deterministic document table extraction and verification system"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "Proprietary"}

dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "PyMuPDF>=1.24.0",
    "pdfplumber>=0.11.0",
    "rapidfuzz>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
